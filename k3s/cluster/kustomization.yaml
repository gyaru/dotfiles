apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system/gotk-components.yaml
  - flux-system/discord.sops.yaml
  - flux-system/git-auth.sops.yaml
  - flux-system/image-automation.yaml
  - flux-system/notifications.yaml
  - flux-system/sops-check.sops.yaml
  - flux-system/gotk-sync.yaml
  - flux-system/reconciliations.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kustomize-controller
      namespace: flux-system
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=CancelHealthCheckOnNewRevision=true
