apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default
resources:
  - default-deny-ingress.yaml
  - bunny-plus
  - home-assistant
  - jellyfin
  - mariadb
  - memcached
  - mosquitto
  - music-assistant
  - radarr
  - seerr
  - seafile
  - sonarr
  - transmission
  - zigbee2mqtt
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: seccomp-default
      spec:
        template:
          spec:
            securityContext:
              seccompProfile:
                type: RuntimeDefault
