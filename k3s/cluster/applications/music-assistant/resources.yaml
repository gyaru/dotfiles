apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: music-assistant-data
  labels:
    app: music-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
  labels:
    app: music-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: music-assistant
  template:
    metadata:
      labels:
        app: music-assistant
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: lapi
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: music-assistant
          image: ghcr.io/music-assistant/server:2.10.4@sha256:37a9a2776e838a754c9f5b38c432567389952304e7cb8f6b44b6cd28043de6de
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 180
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          ports:
            - containerPort: 8095
              name: http
          env:
            - name: TZ
              value: "Europe/Stockholm"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: music-assistant-data
---
apiVersion: v1
kind: Service
metadata:
  name: music-assistant
  labels:
    app: music-assistant
spec:
  type: ClusterIP
  ports:
    - port: 8095
      targetPort: 8095
      protocol: TCP
      name: http
  selector:
    app: music-assistant
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: music-assistant-policy
spec:
  podSelector:
    matchLabels:
      app: music-assistant
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: home-assistant
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 8095
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-assistant
  annotations:
    tailscale.com/hostname: "music-assistant"
    tailscale.com/tags: "tag:k8s"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: music-assistant
      port:
        number: 8095
  tls:
    - hosts:
        - music-assistant
