apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: camofox-data
  labels:
    app: camofox
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: camofox
  labels:
    app: camofox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: camofox
  template:
    metadata:
      labels:
        app: camofox
    spec:
      enableServiceLinks: false
      containers:
        - name: camofox
          image: ghcr.io/jo-inc/camofox-browser:1.13.0@sha256:64b30ffdbbc4ae0e28200a66dfbd6f55ac4188229eb34ef769afcf7be40faa6e
          ports:
            - name: http
              containerPort: 9377
          env:
            - name: CAMOFOX_BIND_HOST
              value: "0.0.0.0"
            - name: CAMOFOX_CRASH_REPORT_ENABLED
              value: "false"
            - name: CAMOFOX_PORT
              value: "9377"
          volumeMounts:
            - name: data
              mountPath: /root/.camofox
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: camofox-data
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: camofox
  labels:
    app: camofox
spec:
  type: ClusterIP
  selector:
    app: camofox
  ports:
    - name: http
      protocol: TCP
      port: 9377
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: camofox
spec:
  podSelector:
    matchLabels:
      app: camofox
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 9377
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: camofox
  annotations:
    tailscale.com/hostname: "camofox"
    tailscale.com/tags: "tag:k8s"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: camofox
      port:
        number: 9377
  tls:
    - hosts:
        - camofox
