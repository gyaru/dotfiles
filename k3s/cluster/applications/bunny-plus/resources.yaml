apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-plus
  labels:
    app: bunny-plus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bunny-plus
  template:
    metadata:
      labels:
        app: bunny-plus
    spec:
      containers:
        - name: bunny-plus
          image: ghcr.io/bunny-plus/core:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - secretRef:
                name: bunny-plus-env
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: bunny-plus
  labels:
    app: bunny-plus
spec:
  type: ClusterIP
  selector:
    app: bunny-plus
  ports:
    - name: http
      protocol: TCP
      port: 8787
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-plus-tunnel
  labels:
    app: bunny-plus-tunnel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bunny-plus-tunnel
  template:
    metadata:
      labels:
        app: bunny-plus-tunnel
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.7.3
          args:
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bunny-plus-tunnel
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bunny-plus
spec:
  podSelector:
    matchLabels:
      app: bunny-plus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bunny-plus-tunnel
      ports:
        - protocol: TCP
          port: 8787
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 192.168.1.240/32
      ports:
        - protocol: TCP
          port: 10000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bunny-plus-tunnel
spec:
  podSelector:
    matchLabels:
      app: bunny-plus-tunnel
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 7844
    - to:
        - podSelector:
            matchLabels:
              app: bunny-plus
      ports:
        - protocol: TCP
          port: 8787
