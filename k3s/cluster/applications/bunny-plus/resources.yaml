apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: bunny-plus-data
  labels:
    app: bunny-plus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-plus
  labels:
    app: bunny-plus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bunny-plus
  template:
    metadata:
      labels:
        app: bunny-plus
    spec:
      automountServiceAccountToken: false
      containers:
        - name: bunny-plus
          image: ghcr.io/bunny-plus/core:latest@sha256:c6d97290327be2ac0af372c0c594945a003e07f9aa7652979201ecef72ead9cd # {"$imagepolicy": "flux-system:bunny-plus"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: ADMIN_DISCORD_IDS
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: ADMIN_DISCORD_IDS
            - name: API_URL
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: API_URL
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: APP_URL
            - name: APP_VERSION
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: APP_VERSION
            - name: CLOUDFLARE_STREAM_SIGNING_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: CLOUDFLARE_STREAM_SIGNING_KEY_ID
            - name: CLOUDFLARE_STREAM_SIGNING_KEY_JWK
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: CLOUDFLARE_STREAM_SIGNING_KEY_JWK
            - name: D1_DATABASE_SECRET
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: D1_DATABASE_SECRET
            - name: D1_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: D1_DATABASE_URL
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: DISCORD_BOT_TOKEN
            - name: DISCORD_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: DISCORD_CLIENT_ID
            - name: DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: DISCORD_CLIENT_SECRET
            - name: DISCORD_GUILD_ID
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: DISCORD_GUILD_ID
            - name: DISCORD_ROLE_PERMISSIONS
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: DISCORD_ROLE_PERMISSIONS
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: JELLYFIN_API_KEY
            - name: RELAY_CONTROLLER_SECRET
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: RELAY_CONTROLLER_SECRET
            - name: RELAY_CONTROLLER_URL
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: RELAY_CONTROLLER_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: SESSION_SECRET
            - name: STREAM_URL
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: STREAM_URL
            - name: STREMIO_ADDON_URL
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: STREMIO_ADDON_URL
            - name: TMDB_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: TMDB_API_TOKEN
            - name: TORBOX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: TORBOX_API_KEY
            - name: JELLYFIN_URL
              value: http://jellyfin.default.svc.cluster.local:8096/jellyfin
            - name: JELLYFIN_STREAM_URL
              value: http://10.43.141.156:8096/jellyfin
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: bunny-plus
  labels:
    app: bunny-plus
spec:
  type: ClusterIP
  selector:
    app: bunny-plus
  ports:
    - name: http
      protocol: TCP
      port: 8787
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-plus-tunnel
  labels:
    app: bunny-plus-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bunny-plus-tunnel
  template:
    metadata:
      labels:
        app: bunny-plus-tunnel
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
          args:
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bunny-plus
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bunny-plus
spec:
  podSelector:
    matchLabels:
      app: bunny-plus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bunny-plus-tunnel
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 8787
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: jellyfin
      ports:
        - protocol: TCP
          port: 8096
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 192.168.1.240/32
      ports:
        - protocol: TCP
          port: 10000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bunny-plus-tunnel
spec:
  podSelector:
    matchLabels:
      app: bunny-plus-tunnel
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 7844
    - to:
        - podSelector:
            matchLabels:
              app: bunny-plus
      ports:
        - protocol: TCP
          port: 8787
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bunny-plus
  annotations:
    tailscale.com/hostname: "bunny-plus"
    tailscale.com/tags: "tag:k8s"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: bunny-plus
      port:
        number: 8787
  tls:
    - hosts:
        - bunny-plus
