apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: bunny-plus-data
  labels:
    app: bunny-plus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-plus
  labels:
    app: bunny-plus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bunny-plus
  template:
    metadata:
      labels:
        app: bunny-plus
    spec:
      automountServiceAccountToken: false
      containers:
        - name: bunny-plus
          image: ghcr.io/bunny-plus/core:latest@sha256:63623f5b1b6ca5a43ab87db40c58b0392ae58e2ae929256b4cc895348ce3165f # {"$imagepolicy": "flux-system:bunny-plus"}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          envFrom:
            - secretRef:
                name: bunny-plus-env
            - secretRef:
                name: bunny-plus-stream
          env:
            - name: STREAM_URL
              valueFrom:
                secretKeyRef:
                  name: bunny-plus-playback
                  key: STREAM_URL
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bunny-plus-discord
                  key: DISCORD_BOT_TOKEN
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: bunny-plus-cloudflare
                  key: CF_ACCOUNT_ID
            - name: CF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bunny-plus-cloudflare
                  key: CF_TOKEN
            - name: JELLYFIN_URL
              value: http://jellyfin.default.svc.cluster.local:8096/jellyfin
            - name: JELLYFIN_STREAM_URL
              value: http://192.168.1.240:8096/jellyfin
          volumeMounts:
            - name: chat-history
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: chat-history
          persistentVolumeClaim:
            claimName: bunny-plus-data
---
apiVersion: v1
kind: Service
metadata:
  name: bunny-plus
  labels:
    app: bunny-plus
spec:
  type: ClusterIP
  selector:
    app: bunny-plus
  ports:
    - name: http
      protocol: TCP
      port: 8787
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunny-plus-tunnel
  labels:
    app: bunny-plus-tunnel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bunny-plus-tunnel
  template:
    metadata:
      labels:
        app: bunny-plus-tunnel
    spec:
      automountServiceAccountToken: false
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
          args:
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bunny-plus-tunnel
                  key: token
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bunny-plus
spec:
  podSelector:
    matchLabels:
      app: bunny-plus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bunny-plus-tunnel
      ports:
        - protocol: TCP
          port: 8787
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: jellyfin
      ports:
        - protocol: TCP
          port: 8096
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    - to:
        - ipBlock:
            cidr: 192.168.1.240/32
      ports:
        - protocol: TCP
          port: 10000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bunny-plus-tunnel
spec:
  podSelector:
    matchLabels:
      app: bunny-plus-tunnel
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: UDP
          port: 7844
        - protocol: TCP
          port: 7844
    - to:
        - podSelector:
            matchLabels:
              app: bunny-plus
      ports:
        - protocol: TCP
          port: 8787
