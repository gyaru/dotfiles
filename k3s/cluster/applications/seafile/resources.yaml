apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: seafile-data
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: seafile-local
  local:
    path: /mlem/seafile/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - lapi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: seafile-data
  labels:
    app: seafile
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: seafile-local
  resources:
    requests:
      storage: 2Ti
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile
  labels:
    app: seafile
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seafile
  template:
    metadata:
      labels:
        app: seafile
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: init-data
          image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - sh
            - -c
            - mkdir -p /shared && chown -R 0:0 /shared
          volumeMounts:
            - name: data
              mountPath: /shared
      containers:
        - name: seafile
          image: seafileltd/seafile-mc:13.0.25@sha256:90c1aaa08731116750cd7ce16cbc6afe0c26006433002d3c7215a5f4254ec244
          startupProbe:
            httpGet:
              path: /api2/ping/
              port: http
              httpHeaders:
                - name: Host
                  value: seafile.tail254553.ts.net
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /api2/ping/
              port: http
              httpHeaders:
                - name: Host
                  value: seafile.tail254553.ts.net
            periodSeconds: 10
            timeoutSeconds: 3
          ports:
            - containerPort: 80
              name: http
          env:
            - name: SEAFILE_MYSQL_DB_HOST
              value: mariadb
            - name: INIT_SEAFILE_MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: root-password
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: seafile
                  key: JWT_PRIVATE_KEY
            - name: INIT_SEAFILE_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: seafile-admin
                  key: email
            - name: INIT_SEAFILE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: seafile-admin
                  key: password
            - name: TIME_ZONE
              value: Europe/Stockholm
            - name: SEAFILE_SERVER_HOSTNAME
              value: seafile.tail254553.ts.net
            - name: SEAFILE_SERVER_PROTOCOL
              value: https
            - name: CACHE_PROVIDER
              value: memcached
            - name: MEMCACHED_HOST
              value: memcached
            - name: MEMCACHED_PORT
              value: "11211"
            - name: ENABLE_SEADOC
              value: "false"
            - name: ENABLE_NOTIFICATION_SERVER
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /shared
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seafile-data
---
apiVersion: v1
kind: Service
metadata:
  name: seafile
  labels:
    app: seafile
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: seafile
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: seafile-policy
spec:
  podSelector:
    matchLabels:
      app: seafile
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: mariadb
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - podSelector:
            matchLabels:
              app: memcached
      ports:
        - protocol: TCP
          port: 11211
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seafile
  annotations:
    tailscale.com/hostname: "seafile"
    tailscale.com/tags: "tag:k8s"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: seafile
      port:
        number: 80
  tls:
    - hosts:
        - seafile
